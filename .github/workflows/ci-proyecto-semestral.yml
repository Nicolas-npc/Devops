name: CI Proyecto Semestral

on:
  push:
    branches: ["main", "master", "deploy"]
    paths:
      - "back-Ventas_SpringBoot/**"
      - "back-Despachos_SpringBoot/**"
      - "front_despacho/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "master", "deploy"]
    paths:
      - "back-Ventas_SpringBoot/**"
      - "back-Despachos_SpringBoot/**"
      - "front_despacho/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar backend ventas
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: ./mvnw -DskipTests package

      - name: Compilar backend despachos
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: ./mvnw -DskipTests package

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: front_despacho
        run: npm ci

      - name: Construir frontend
        working-directory: front_despacho
        env:
          VITE_BACKEND_PROXY_TARGET: http://localhost:8081
        run: npm run build

  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar configuración de Docker Compose local
        run: docker compose config

      - name: Construir imágenes del stack local
        run: docker compose build --no-cache