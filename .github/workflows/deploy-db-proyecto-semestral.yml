name: Deploy Proyecto Semestral DB
# Despliega MySQL en la misma EC2 de backend (arquitectura de 2 EC2)

on:
  workflow_dispatch:
    inputs:
      ec2_path:
        description: "Ruta de trabajo en la EC2 de base de datos"
        required: true
        default: "/opt/proyecto-semestral-db"
  push:
    branches: ["deploy"]
    paths:
      - ".github/workflows/deploy-db-proyecto-semestral.yml"

permissions:
  contents: read

jobs:
  deploy-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Reiniciar MySQL en EC2 backend por SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar MySQL en EC2 backend" \
            --parameters "{\"commands\":[\"set -e\",\"docker network create proyecto-semestral-net || true\",\"docker volume create proyecto-semestral-dbdata || true\",\"docker stop proyecto-semestral-db || true\",\"docker rm proyecto-semestral-db || true\",\"docker pull mysql:8.0\",\"docker run -d --name proyecto-semestral-db --network proyecto-semestral-net --restart unless-stopped -p 3306:3306 -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }} -e MYSQL_DATABASE=${{ secrets.DB_NAME }} -e MYSQL_USER=${{ secrets.DB_USER }} -e MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }} -v proyecto-semestral-dbdata:/var/lib/mysql mysql:8.0 --default-authentication-plugin=mysql_native_password\"]}" \
            --output text