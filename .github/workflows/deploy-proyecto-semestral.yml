name: Deploy Proyecto Semestral Backend

on:
  workflow_dispatch:
    inputs:
      ec2_path:
        description: "Ruta absoluta del proyecto en la EC2 de backend"
        required: true
        default: "/opt/proyecto-semestral"
  push:
    branches: ["deploy"]
    paths:
      - "back-Despachos_SpringBoot/**"
      - "back-Ventas_SpringBoot/**"

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push backend ventas
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          docker build -t proyecto-semestral-ventas .
          docker tag proyecto-semestral-ventas:latest ${{ secrets.ECR_REPO_URL_VENTAS }}:latest
          docker push ${{ secrets.ECR_REPO_URL_VENTAS }}:latest

      - name: Build y push backend despachos
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker build -t proyecto-semestral-despachos .
          docker tag proyecto-semestral-despachos:latest ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest
          docker push ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest

      - name: Reiniciar backend ventas en EC2 por SSM
        env:
          EC2_PATH: ${{ github.event.inputs.ec2_path }}
        run: |
          if [ -z "$EC2_PATH" ]; then EC2_PATH="/opt/proyecto-semestral"; fi

          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_VENTAS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar backend ventas" \
            --parameters "{\"commands\":[\"set -e\",\"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}\",\"docker pull ${{ secrets.ECR_REPO_URL_VENTAS }}:latest\",\"docker stop proyecto-semestral-ventas || true\",\"docker rm proyecto-semestral-ventas || true\",\"docker run -d --name proyecto-semestral-ventas -p 8080:8080 -e DB_ENDPOINT=${{ secrets.DB_EC2_ENDPOINT }} -e DB_PORT=3306 -e DB_NAME=${{ secrets.DB_NAME }} -e DB_USERNAME=${{ secrets.DB_USER }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ secrets.ECR_REPO_URL_VENTAS }}:latest\"]}" \
            --output text

      - name: Reiniciar backend despachos en EC2 por SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_DESPACHOS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar backend despachos" \
            --parameters "{\"commands\":[\"set -e\",\"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}\",\"docker pull ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest\",\"docker stop proyecto-semestral-despachos || true\",\"docker rm proyecto-semestral-despachos || true\",\"docker run -d --name proyecto-semestral-despachos -p 8081:8081 -e DB_ENDPOINT=${{ secrets.DB_EC2_ENDPOINT }} -e DB_PORT=3306 -e DB_NAME=${{ secrets.DB_NAME }} -e DB_USERNAME=${{ secrets.DB_USER }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest\"]}" \
            --output text