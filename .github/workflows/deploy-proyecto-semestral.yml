name: Deploy Proyecto Semestral Backend

on:
  workflow_dispatch:
  push:
    branches: ["deploy"]
    paths:
      - "back-Despachos_SpringBoot/**"
      - "back-Ventas_SpringBoot/**"

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push backend ventas
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          docker build -t proyecto-semestral-ventas .
          docker tag proyecto-semestral-ventas:latest ${{ secrets.ECR_REPO_URL_VENTAS }}:latest
          docker push ${{ secrets.ECR_REPO_URL_VENTAS }}:latest

      - name: Build y push backend despachos
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker build -t proyecto-semestral-despachos .
          docker tag proyecto-semestral-despachos:latest ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest
          docker push ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest

      - name: Desplegar MySQL + backends en una sola EC2 por SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar MySQL + backends proyecto semestral" \
            --parameters "{\"commands\":[\"set -e\",\"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}\",\"docker network create proyecto-semestral-net || true\",\"docker volume create proyecto-semestral-dbdata || true\",\"docker pull mysql:8.0\",\"docker pull ${{ secrets.ECR_REPO_URL_VENTAS }}:latest\",\"docker pull ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest\",\"docker stop proyecto-semestral-db || true\",\"docker rm proyecto-semestral-db || true\",\"docker run -d --name proyecto-semestral-db --network proyecto-semestral-net --restart unless-stopped -p 3306:3306 -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }} -e MYSQL_DATABASE=${{ secrets.DB_NAME }} -e MYSQL_USER=${{ secrets.DB_USER }} -e MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }} -v proyecto-semestral-dbdata:/var/lib/mysql mysql:8.0 --default-authentication-plugin=mysql_native_password\",\"sleep 20\",\"docker stop proyecto-semestral-ventas || true\",\"docker rm proyecto-semestral-ventas || true\",\"docker stop proyecto-semestral-despachos || true\",\"docker rm proyecto-semestral-despachos || true\",\"docker run -d --name proyecto-semestral-ventas --network proyecto-semestral-net -p 8080:8080 -e DB_ENDPOINT=proyecto-semestral-db -e DB_PORT=3306 -e DB_NAME=${{ secrets.DB_NAME }} -e DB_USERNAME=${{ secrets.DB_USER }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ secrets.ECR_REPO_URL_VENTAS }}:latest\",\"docker run -d --name proyecto-semestral-despachos --network proyecto-semestral-net -p 8081:8081 -e DB_ENDPOINT=proyecto-semestral-db -e DB_PORT=3306 -e DB_NAME=${{ secrets.DB_NAME }} -e DB_USERNAME=${{ secrets.DB_USER }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest\"]}" \
            --output text