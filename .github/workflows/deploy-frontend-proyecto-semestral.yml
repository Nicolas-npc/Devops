name: Deploy Proyecto Semestral Frontend

on:
  workflow_dispatch:
    inputs:
      ventas_upstream:
        description: "Host o IP del backend de ventas expuesto por la EC2"
        required: false
      despachos_upstream:
        description: "Host o IP del backend de despachos expuesto por la EC2"
        required: false
  push:
    branches: ["deploy"]
    paths:
      - "front_despacho/**"

permissions:
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push frontend
        working-directory: front_despacho
        run: |
          npm ci
          npm run build
          docker build -t proyecto-semestral-frontend .
          docker tag proyecto-semestral-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

      - name: Reiniciar frontend en EC2 por SSM
        run: |
          VENTAS_UPSTREAM="${{ github.event.inputs.ventas_upstream || secrets.VENTAS_UPSTREAM }}"
          DESPACHOS_UPSTREAM="${{ github.event.inputs.despachos_upstream || secrets.DESPACHOS_UPSTREAM }}"

          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_FRONTEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar frontend proyecto semestral" \
            --parameters "{\"commands\":[\"set -e\",\"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}\",\"docker pull ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest\",\"docker stop proyecto-semestral-frontend || true\",\"docker rm proyecto-semestral-frontend || true\",\"docker run -d --name proyecto-semestral-frontend -p 80:80 -e VENTAS_UPSTREAM=$VENTAS_UPSTREAM -e DESPACHOS_UPSTREAM=$DESPACHOS_UPSTREAM ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest\"]}" \
            --output text